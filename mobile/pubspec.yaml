name: packurbag
description: Packurbag — your offline-friendly travel companion.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  avatar_glow: ^3.0.1
  cupertino_icons: ^1.0.9
  dio: ^5.10.0
  flex_color_picker: ^3.8.0
  flutter:
    sdk: flutter
  flutter_phone_direct_caller: ^2.2.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_speed_dial: ^7.0.0
  flutter_tts: ^4.2.5
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  lottie: ^3.5.1
  lucide_icons_flutter: ^3.1.15
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  quick_actions: ^1.1.0
  sensors_plus: ^7.1.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  slide_to_act: ^2.0.2
  speech_to_text: ^7.4.0
  torch_light: ^2.0.0
  url_launcher: ^6.3.2
  vibration: ^3.2.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: 3.2.5
  json_serializable: ^6.14.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/packurbag-logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#075E72"
  adaptive_icon_background: "#075E72"
  adaptive_icon_foreground: "assets/packurbag-logo.png"
  web:
    generate: true
    image_path: "assets/packurbag-logo.png"
    background_color: "#075E72"
    theme_color: "#075E72"
  windows:
    generate: true
    image_path: "assets/packurbag-logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/packurbag-logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/animations/
    - assets/sounds/
