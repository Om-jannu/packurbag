allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// AGP 8+ requires every Android library module to declare a `namespace`.
// A handful of older plugins (e.g. torch_controller, flutter_phone_direct_caller)
// were never updated for that and only have the legacy manifest `package`
// attribute — this backfills the namespace from that attribute for any
// subproject missing one, so it also covers older plugins added later
// instead of needing a per-package fix each time one shows up.
subprojects { subproject ->
    def backfillNamespace = {
        if (subproject.plugins.hasPlugin("com.android.library")) {
            def androidExt = subproject.extensions.findByName("android")
            if (androidExt != null && androidExt.namespace == null) {
                def manifestFile = subproject.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def matcher = manifestFile.text =~ /package="([^"]+)"/
                    if (matcher.find()) {
                        androidExt.namespace = matcher.group(1)
                    }
                }
            }
        }
    }
    // Flutter's plugin loader can evaluate some plugin subprojects earlier
    // than Gradle's normal ordering, so by the time this line runs a given
    // subproject may already be evaluated — calling afterEvaluate on one
    // that's already executed throws, so apply immediately in that case.
    if (subproject.state.executed) {
        backfillNamespace()
    } else {
        subproject.afterEvaluate { backfillNamespace() }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
